name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check rotawise pipeline tests
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rotawise .
      - run: |
          docker run -d -p 8000:8000 --name rw rotawise
          for i in $(seq 1 20); do curl -fs localhost:8000/api/v1/ready && exit 0; sleep 1; done
          docker logs rw; exit 1
