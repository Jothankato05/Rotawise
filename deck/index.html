<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotawise · NASA Space Apps 2026</title>
<meta name="description" content="Rotawise: field memory from NASA satellites. Crop rotation advice for Nigerian smallholder farms, on any phone. Team Primers, NASA Space Apps Challenge 2026, Abuja.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
html,body{margin:0;height:100%;background:#07173F;overflow:hidden;font-family:system-ui,sans-serif}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.slide{position:absolute;max-width:100vw;max-height:100vh;aspect-ratio:16/9;width:min(100vw,177.78vh);opacity:0;visibility:hidden;transition:opacity .35s}
.slide.active{opacity:1;visibility:visible}
.slide img{width:100%;height:100%;display:block}
nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:10px;z-index:2}
nav button{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer}
nav button.on{background:#EAFE07;transform:scale(1.3)}
.arrow{position:fixed;top:0;bottom:0;width:18vw;border:0;background:transparent;cursor:pointer;z-index:1}
.arrow.prev{left:0}.arrow.next{right:0}
.arrow:focus-visible{outline:2px solid #EAFE07}
@media print{html,body{overflow:visible;height:auto}.stage{position:static;display:block}.slide{position:relative;opacity:1;visibility:visible;width:100%;break-after:page}nav,.arrow{display:none}}
</style>
</head>
<body>
<main class="stage" id="stage">
<section class="slide active" aria-label="Slide 1 of 7"><img src="slides/1.webp" alt="NASA SPACE APPS CHALLENGE  ·  NOVEMBER 14–15, 2026  ·  ABUJA · ROTAWISE · FIELD MEMORY FROM NASA SATELLITES · Challenge: Field Shift: Adapting Farms with NASA Data · Presented by Team Primers Jothan Jerry Kato (lead) · Adamilo Aaron Daniel · Umar Faruq Oladoja · Miracle Mathew · Sadiq Bashir Abdullahi · Ndazibari Charles Joshua November 2026" width="1920" height="1080" fetchpriority=high></section>
<section class="slide" aria-label="Slide 2 of 7"><img src="slides/2.webp" alt="THE PROBLEM · SAME FIELD, SAME CROP, SEASON AFTER SEASON · 02 / 07 · Savanna smallholders plant maize on the same land year after year. The soil tires, Striga weed spreads and fertilizer keeps getting dearer. Extension advice is generic, agents are too few, and no one tells the farmer what to change on their own plot. · &lt;2 t/ha · Mean maize yield in the Guinea savanna · 70–100% · Crop losses farmers report from Striga · ₦50,000+ · One 50 kg bag of urea · Who it hurts most: smallholders on 0.5 to 2 hectares in the northern and middle belt savanna, most with a basic phone and no data. · Sources: Heliyon 2022 · Striga farmer surveys, northern Nigeria · market reports 2025–26" width="1920" height="1080" loading=lazy></section>
<section class="slide" aria-label="Slide 3 of 7"><img src="slides/3.webp" alt="KEY INSIGHT · OUR SOLUTION · SATELLITES ALREADY REMEMBER EVERY SEASON · 03 / 07 · Farmers rarely keep records, but NASA has watched each field every few days for years. Rotawise turns that memory into one rotation choice the farmer can act on. · 01 · Field memory · Each season since 2020 read as cereal like, legume like or bare, with a confidence score. · NASA HLS · 02 · Soil fatigue · A 0 to 100 score from the cereal run, the greenness trend and soil carbon, nitrogen and pH. · NASA HLS · SoilGrids · 03 · Climate test · Rain onset, dry spells and heat today, and rain and hot days projected for the 2040s. · NASA POWER · NEX-GDDP-CMIP6 · 04 · Rotation choice · The current rotation against four others, with reasons, evidence, naira, gaps and risks. · Nigerian field trials" width="1920" height="1080" loading=lazy></section>
<section class="slide" aria-label="Slide 4 of 7"><img src="slides/4.webp" alt="THE EXPERIENCE · ONE CLEAR ANSWER, ON ANY PHONE · 04 / 07 · BEFORE · Malam Musa in Zaria plans maize again, the fourth season in a row. · DURING · He dials the short code, picks Hausa and his farm, and gets the reply in seconds. · AFTER · His extension officer sees the same plan on the dashboard map and checks seed and soil phosphorus with him. · Farmer name is illustrative · live at rotawise-five.vercel.app · USSD  ·  ROTAWISE · Plant SOYBEAN next season, then maize. Saves 0.6-2.4 bags urea/ha (N30-N120k). Cuts Striga up to 76%. Confirm with your extension agent. · Live reply · Zaria pilot farm · urea ₦50,000/bag" width="1920" height="1080" loading=lazy></section>
<section class="slide" aria-label="Slide 5 of 7"><img src="slides/5.webp" alt="INCLUSIVE BY DESIGN · BUILT FOR THE FARMER MOST TOOLS LEAVE OUT · 05 / 07 · Who could be excluded | The barrier | What we designed differently | How we validate · Farmers with basic phones | No smartphone, no data | USSD on any phone, replies under 182 characters | Field test in five LGAs · Farmers who don&#x27;t read English | Language | Hausa and English now, Hausa voice next | Native speaker review of every message · Women and tenant farmers | No land papers or records | Plot history read from orbit, nothing to fill in | Pilot with women&#x27;s cooperatives · Farmers on tiny mixed plots | 30 m pixels can misread | A confidence score on every season; the farmer confirms | Test against labelled fields · Free to the farmer · no app download · no sign up" width="1920" height="1080" loading=lazy></section>
<section class="slide" aria-label="Slide 6 of 7"><img src="slides/6.webp" alt="IMPACT · FEASIBILITY · A LEGUME BREAK PAYS THE FARMER BACK · 06 / 07 · 2.4 bags · Urea saved per hectare when soybean comes before maize, about ₦120,000 · +68% · Maize yield after soybean vs continuous maize · −76% · Striga after two legume seasons · Upper values, northern Guinea savanna · NJSER 2008 · Yusuf et al. 2009 · Kureh et al. 2006 · REAL NASA DATA · 5 PILOT FARMS · Farm | Cereal run | Fatigue | Advice · Zaria | 3 | 52 | Maize → Soybean · Dawakin Tofa | 4 | 60 | Sorghum → Cowpea · Bida | mixed | 53 | Maize → Soybean · Bokkos | 4 | 57 | Maize → Soybean · Gwagwalada | 4 | 58 | Maize → Soybean · Success looks like · Farmers switching to a legume, urea bags saved, yield and Striga checked each season. · Feasible · Open NASA data, no hardware, already live. Partners: ADP extension services, cooperatives, a USSD aggregator. · Risks · Pixel limits on tiny plots, price swings, trust. Handled with confidence scores, editable prices and agent sign off." width="1920" height="1080" loading=lazy></section>
<section class="slide" aria-label="Slide 7 of 7"><img src="slides/7.webp" alt="PROTOTYPE · NEXT STEPS · THE ASK · WORKING TODAY ON REAL NASA DATA · 07 / 07 · Built and tested · Live dashboard, USSD in Hausa and English, open API. 1,824 satellite readings across five pilot farms. · Next · Check readings against labelled fields, pilot in five LGAs, add Hausa voice, Yoruba and Igbo. · The ask · Pilot access through state ADPs and cooperatives, labelled field data for testing, and a USSD short code partner. · Thank you  ·  rotawise-five.vercel.app  ·  github.com/Jothankato05/Rotawise" width="1920" height="1080" loading=lazy></section>
</main>
<button class="arrow prev" aria-label="Previous slide"></button><button class="arrow next" aria-label="Next slide"></button>
<nav id="dots" aria-label="Slides"></nav>
<script>
const slides=[...document.querySelectorAll('.slide')],dots=document.getElementById('dots');let i=0;
slides.forEach((_,n)=>{const b=document.createElement('button');b.setAttribute('aria-label','Go to slide '+(n+1));b.onclick=()=>go(n);dots.appendChild(b);});
function go(n){n=Math.max(0,Math.min(slides.length-1,n));slides[i].classList.remove('active');i=n;slides[i].classList.add('active');[...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));history.replaceState(null,'','#'+(i+1));}
document.querySelector('.prev').onclick=()=>go(i-1);document.querySelector('.next').onclick=()=>go(i+1);
addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(i+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(i-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);});
let sx=null;addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>40)go(i+(d<0?1:-1));sx=null;});
const h=parseInt(location.hash.slice(1),10);go(Number.isFinite(h)?h-1:0);
</script>
</body>
</html>
