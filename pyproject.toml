[project]
name = "rotawise"
version = "1.0.0"
description = "Crop rotation decision support for Nigerian smallholder farms from NASA Earth observations"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"

[tool.ruff]
line-length = 180
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
